<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot 2 - Tracking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0E1A;
    }

    .screenshot-container {
      width: 1284px;
      height: 2778px;
      background: linear-gradient(180deg, #0A0E1A 0%, #0D1220 50%, #0A0E1A 100%);
      position: relative;
      overflow: hidden;
    }

    .marketing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 120px 80px 180px;
      background: linear-gradient(180deg, rgba(10, 14, 26, 0.98) 0%, rgba(10, 14, 26, 0.9) 60%, transparent 100%);
      z-index: 10;
      text-align: center;
    }

    .headline {
      font-size: 82px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 48px;
    }

    .headline span {
      color: #F59E0B;
    }

    .features-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .feature-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .feature-check {
      width: 44px;
      height: 44px;
      background: #22C55E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      font-weight: bold;
    }

    .feature-text {
      font-size: 38px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    .app-mockup {
      position: absolute;
      top: 700px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
    }

    .card {
      background: #151B2B;
      border-radius: 32px;
      padding: 48px;
      margin-bottom: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    /* Streak Card */
    .streak-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
      border-radius: 32px;
      padding: 48px;
      margin-bottom: 32px;
      box-shadow: 0 20px 60px rgba(249, 115, 22, 0.3);
    }

    .streak-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .streak-icon {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .streak-info h3 {
      font-size: 28px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    .streak-info .number {
      font-size: 56px;
      font-weight: 800;
      color: white;
    }

    .streak-right {
      text-align: right;
    }

    .streak-right .label {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.7);
    }

    .streak-right .value {
      font-size: 32px;
      font-weight: 700;
      color: white;
    }

    /* Quick Stats */
    .quick-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .stat-card {
      background: #151B2B;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
    }

    .stat-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }

    .stat-icon.blue { background: rgba(59, 130, 246, 0.15); }
    .stat-icon.green { background: rgba(34, 197, 94, 0.15); }
    .stat-icon.amber { background: rgba(245, 158, 11, 0.15); }
    .stat-icon.purple { background: rgba(168, 85, 247, 0.15); }

    .stat-value {
      font-size: 44px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 26px;
      color: #64748B;
    }

    /* Checklist Preview */
    .checklist-card {
      background: #151B2B;
      border-radius: 32px;
      padding: 48px;
    }

    .checklist-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .checklist-icon {
      width: 64px;
      height: 64px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .checklist-title {
      font-size: 32px;
      font-weight: 600;
      color: #F8FAFC;
    }

    .checklist-subtitle {
      font-size: 24px;
      color: #94A3B8;
    }

    .checklist-progress {
      height: 12px;
      background: #0A0E1A;
      border-radius: 6px;
      overflow: hidden;
    }

    .checklist-fill {
      height: 100%;
      width: 75%;
      background: linear-gradient(90deg, #3B82F6, #2563EB);
      border-radius: 6px;
    }

    /* Highlight callout */
    .highlight-callout {
      position: absolute;
      top: 780px;
      right: 60px;
      background: #F59E0B;
      color: #000;
      padding: 16px 32px;
      border-radius: 100px;
      font-size: 28px;
      font-weight: 700;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
    }

    .highlight-callout::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 50%;
      transform: translateY(-50%);
      border: 12px solid transparent;
      border-right-color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="screenshot-container">
    <div class="marketing-overlay">
      <h1 class="headline">Build <span>Consistency</span></h1>
      <div class="features-list">
        <div class="feature-row">
          <div class="feature-check">✓</div>
          <span class="feature-text">Track sleep quality & energy</span>
        </div>
        <div class="feature-row">
          <div class="feature-check">✓</div>
          <span class="feature-text">Build daily streaks</span>
        </div>
        <div class="feature-row">
          <div class="feature-check">✓</div>
          <span class="feature-text">Quick 30-second logging</span>
        </div>
      </div>
    </div>

    <div class="highlight-callout">Keep the momentum!</div>

    <div class="app-mockup">
      <!-- Streak Card -->
      <div class="streak-card">
        <div class="streak-left">
          <div class="streak-icon">🔥</div>
          <div class="streak-info">
            <h3>Current Streak</h3>
            <div class="number">14 days</div>
          </div>
        </div>
        <div class="streak-right">
          <div class="label">Best</div>
          <div class="value">21 days</div>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="quick-stats">
        <div class="stat-card">
          <div class="stat-icon blue">😴</div>
          <div class="stat-value">7.5h</div>
          <div class="stat-label">Avg Sleep</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">⚡</div>
          <div class="stat-value">82</div>
          <div class="stat-label">Avg Score</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber">⭐</div>
          <div class="stat-value">4.2</div>
          <div class="stat-label">Avg Quality</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">📊</div>
          <div class="stat-value">14</div>
          <div class="stat-label">Nights Logged</div>
        </div>
      </div>

      <!-- Checklist -->
      <div class="checklist-card" style="margin-top: 32px;">
        <div class="checklist-header">
          <div class="checklist-icon">📋</div>
          <div>
            <div class="checklist-title">Pre-Sleep Checklist</div>
            <div class="checklist-subtitle">6/8 completed</div>
          </div>
        </div>
        <div class="checklist-progress">
          <div class="checklist-fill"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
