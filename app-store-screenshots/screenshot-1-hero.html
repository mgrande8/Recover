<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot 1 - Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0E1A;
      min-height: 100vh;
    }

    .screenshot-container {
      width: 1284px;
      height: 2778px;
      background: linear-gradient(180deg, #0A0E1A 0%, #0D1220 50%, #0A0E1A 100%);
      position: relative;
      overflow: hidden;
    }

    /* Marketing overlay at top */
    .marketing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 120px 80px 200px;
      background: linear-gradient(180deg, rgba(10, 14, 26, 0.98) 0%, rgba(10, 14, 26, 0.9) 60%, transparent 100%);
      z-index: 10;
      text-align: center;
    }

    .headline {
      font-size: 82px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }

    .headline span {
      color: #F59E0B;
    }

    .subtext {
      font-size: 42px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.4;
    }

    /* App mockup area */
    .app-mockup {
      position: absolute;
      top: 500px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
    }

    /* Simulated dashboard */
    .dashboard {
      background: #151B2B;
      border-radius: 48px;
      padding: 60px;
      box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      background: #3B82F6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 700;
      color: #F8FAFC;
    }

    .greeting {
      margin-bottom: 50px;
    }

    .greeting h1 {
      font-size: 48px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 8px;
    }

    .greeting p {
      font-size: 32px;
      color: #94A3B8;
    }

    /* Recovery Score Card */
    .recovery-card {
      background: #1E293B;
      border-radius: 32px;
      padding: 50px;
      text-align: center;
      margin-bottom: 40px;
    }

    .recovery-label {
      font-size: 24px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .recovery-score {
      font-size: 180px;
      font-weight: 800;
      color: #22C55E;
      line-height: 1;
      margin-bottom: 16px;
    }

    .recovery-status {
      font-size: 36px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 8px;
    }

    .recovery-message {
      font-size: 28px;
      color: #94A3B8;
    }

    .progress-bar {
      height: 16px;
      background: #0A0E1A;
      border-radius: 8px;
      margin-top: 40px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 87%;
      background: linear-gradient(90deg, #22C55E, #16A34A);
      border-radius: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid #334155;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 40px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 24px;
      color: #64748B;
    }

    /* Feature highlight */
    .feature-highlight {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 60px;
      z-index: 10;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 20px 32px;
      border-radius: 100px;
    }

    .feature-check {
      width: 32px;
      height: 32px;
      background: #22C55E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .feature-text {
      font-size: 28px;
      color: #F8FAFC;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screenshot-container">
    <!-- Marketing Overlay -->
    <div class="marketing-overlay">
      <h1 class="headline">Sleep Better.<br><span>Perform Better.</span></h1>
      <p class="subtext">Track, analyze, and optimize your recovery</p>
    </div>

    <!-- App Mockup -->
    <div class="app-mockup">
      <div class="dashboard">
        <div class="dash-header">
          <div class="logo">
            <div class="logo-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </div>
            <span class="logo-text">Recover</span>
          </div>
        </div>

        <div class="greeting">
          <h1>Good morning, Alex!</h1>
          <p>Here's your recovery from last night.</p>
        </div>

        <div class="recovery-card">
          <p class="recovery-label">Recovery Score</p>
          <div class="recovery-score">87</div>
          <p class="recovery-status">Fully Recovered</p>
          <p class="recovery-message">Ready for high intensity</p>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value">7h 45m</div>
              <div class="stat-label">Duration</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">4/5</div>
              <div class="stat-label">Quality</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">5/5</div>
              <div class="stat-label">Energy</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Feature Highlights -->
    <div class="feature-highlight">
      <div class="feature-item">
        <div class="feature-check">✓</div>
        <span class="feature-text">Daily Recovery Score</span>
      </div>
      <div class="feature-item">
        <div class="feature-check">✓</div>
        <span class="feature-text">30-Second Logging</span>
      </div>
    </div>
  </div>
</body>
</html>
